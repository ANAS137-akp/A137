<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A137</title>
    <style>
        :root {
            --bg-main: #0b0c10; --bg-panel: #1f2833;
            --accent: #66fcf1; --text-main: #c5c6c7;
            --border: #45a29e; --danger: #ff4c4c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--bg-panel); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); }
        .logo { font-size: 1.4rem; font-weight: bold; color: var(--accent); }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        
        button { background: var(--bg-main); color: var(--accent); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: var(--accent); color: var(--bg-main); }
        
        .workspace { display: flex; flex: 1; height: calc(100vh - 60px); }
        .panel { flex: 1; display: flex; flex-direction: column; padding: 12px; }
        .panel.left { border-left: 2px solid var(--border); }
        [dir="ltr"] .panel.left { border-left: none; border-right: 2px solid var(--border); }
        
        textarea.editor { flex: 1; background: #050505; color: #00ffcc; border: 1px solid var(--border); border-radius: 6px; padding: 15px; font-family: monospace; font-size: 1rem; line-height: 1.5; resize: none; outline: none; }
        .preview-wrapper { flex: 1; background: #fff; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
        iframe { width: 100%; height: 100%; border: none; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-panel); border: 2px solid var(--border); border-radius: 10px; width: 90%; max-width: 750px; max-height: 85vh; padding: 20px; overflow-y: auto; position: relative; }
        
        .close-btn { position: absolute; top: 12px; left: 12px; background: var(--danger); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
        [dir="ltr"] .close-btn { left: auto; right: 12px; }
        
        .file-box { border: 2px dashed var(--accent); padding: 20px; text-align: center; border-radius: 6px; cursor: pointer; margin: 15px 0; }
        #decompiledCode { width: 100%; height: 250px; background: #000; color: #00ffcc; margin-top: 10px; padding: 10px; border-radius: 6px; font-family: monospace; display: none; resize: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">A137 code IDE</div>
        <div class="toolbar">
            <button id="btnRun" onclick="runCompiler()">▶ معاينة النتيجة</button>
            <button id="btnDownload" onclick="downloadHTML()">💾 تحميل ملف</button>
            <button id="btnDecompile" onclick="openDecompileModal()">🔓 تفكك الملف</button>
            <button id="btnGuide" onclick="openGuide()">📖 دليل اللغة</button>
            <button id="btnLang" onclick="toggleLanguage()">🌐 English / عربي</button>
        </div>
    </header>

    <div class="workspace">
        <div class="panel left">
            <textarea id="codeEditor" class="editor" spellcheck="false">!start-a137!
webapp!My A137 WebApp!

@ === 1. العنوان والأشكال ===
p"مرحباً بك في تطبيق A137 code"#ff0055
bj#1a1a2e(100.100)%100
bgo#00ccff(4.2)%80

@ === 2. الأسئلة والنظام الرياضي ===
u1 = ask"أدخل الرقم الأول:"
u2 = ask'أدخل الرقم الثاني:'
Math...u1+u2=sumResult
p"نتيجة الجمع:"#00ff00
p"sumResult"

@ === 3. الذكاء الاصطناعي ===
u3 = ask"اكتب كلمة فيها proo للاختبار:"
in.u3 = "proo"
b "proo" f "Ai"
p"النتيجة بعد تعديل الخوارزمية:"#ff00ff
p"u3"

@ === 4. الأزرار والبوابات ===
cp"زر مستمر لا يختفي"gt
p'تم ضغط الزر بنجاح!'#00ffcc

cb"زر يختفي عند الضغط"gt
p"اختفى الزر ظهر هذا النص!"#ffaa00

Fpay#50.00#'USD'
https://checkout.pay#100.00#"SAR"

!end!</textarea>
        </div>
        <div class="panel right">
            <div class="preview-wrapper">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <!-- نافذة تفكيك الملف لاستخراج كود الـ HTML -->
    <div class="modal-overlay" id="decompileModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('decompileModal')">✕</button>
            <h2 id="decompTitle" style="color:var(--accent);">تفكيك واستخراج كود HTML</h2>
            <p id="decompDesc">قم برفع أي ملف HTML لتفكيكه واستخراج كود الـ HTML الصافي منه لنسخه واستخدامه في مشاريعك:</p>
            
            <div class="file-box" onclick="document.getElementById('fileUpload').click()">
                <span id="lblUpload">📄 اضغط هنا لاختيار ملف HTML</span>
                <input type="file" id="fileUpload" accept=".html" style="display:none;" onchange="handleFileUpload(event)">
            </div>
            
            <textarea id="decompiledCode" readonly></textarea>
            <button id="btnCopyDecomp" style="display:none; margin-top:10px; width:100%;" onclick="copyDecompiled()">📋 نسخ كود الـ HTML</button>
        </div>
    </div>

    <!-- نافذة دليل اللغة -->
    <div class="modal-overlay" id="guideModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('guideModal')">✕</button>
            <h2 id="guideTitle" style="color:var(--accent); margin-bottom:15px;">دليل وقوانين لغة A137 code</h2>
            <div id="guideBody"></div>
        </div>
    </div>

    <script>
        let currentLang = 'ar';
        const dict = {
            ar: {
                btnRun: "▶ معاينة النتيجة", btnDownload: "💾 تحميل ملف", btnDecompile: "🔓 تفكك الملف", btnGuide: "📖 دليل اللغة", btnLang: "🌐 English / عربي",
                decompTitle: "تفكيك واستخراج كود HTML", decompDesc: "قم برفع أي ملف HTML لتفكيكه واستخراج كود الـ HTML الصافي منه لنسخه واستخدامه في مشاريعك:",
                lblUpload: "📄 اضغط هنا لاختيار ملف HTML", btnCopyDecomp: "📋 نسخ كود الـ HTML", guideTitle: "دليل وقوانين لغة A137 code"
            },
            en: {
                btnRun: "▶ Preview Result", btnDownload: "💾 Download File", btnDecompile: "🔓 Decompile File", btnGuide: "📖 Language Guide", btnLang: "🌐 عربي / English",
                decompTitle: "Decompile & Extract HTML Code", decompDesc: "Upload any HTML file to extract pure HTML code for your projects:",
                lblUpload: "📄 Click here to select HTML file", btnCopyDecomp: "📋 Copy HTML Code", guideTitle: "A137 Code Language Rules"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            for (let id in dict[currentLang]) {
                let el = document.getElementById(id);
                if (el) el.innerText = dict[currentLang][id];
            }
            renderGuide();
        }

        function openGuide() { renderGuide(); document.getElementById('guideModal').classList.add('active'); }
        function openDecompileModal() { document.getElementById('decompileModal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // تفكيك وقراءة ملف ה-HTML واستخراج الكود
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const textArea = document.getElementById('decompiledCode');
                const btnCopy = document.getElementById('btnCopyDecomp');
                
                textArea.style.display = 'block';
                textArea.value = content; // استخراج كود الـ HTML بالكامل
                btnCopy.style.display = 'block';
            };
            reader.readAsText(file);
        }

        function copyDecompiled() {
            const txt = document.getElementById('decompiledCode');
            txt.select();
            document.execCommand('copy');
            alert(currentLang === 'ar' ? "تم نسخ كود الـ HTML بنجاح!" : "HTML code copied successfully!");
        }

        function compileA137(sourceCode) {
            if (!sourceCode.includes('!start-a137!') || !sourceCode.includes('!end!')) {
                return `<h3 style="color:red; text-align:center;">Error: Missing !start-a137! or !end!</h3>`;
            }

            let appName = "A137 App";
            const appMatch = sourceCode.match(/webapp!(.*?!)/);
            if (appMatch) appName = appMatch[1].replace('!', '');

            const lines = sourceCode.split('\n');
            let htmlBody = '';
            let jsLogic = `let memory = {};\n`;

            jsLogic += `function evalM(eq) {
                try {
                    return eval(eq.replace(/([a-zA-Z0-9_]+)/g, m => memory[m] !== undefined ? memory[m] : m).replace(/\\^/g, '**').replace(/÷/g, '/'));
                } catch(e) { return 0; }
            }\n`;

            let isNextHidden = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line || line.startsWith('!start') || line.startsWith('!end') || line.startsWith('webapp!')) continue;
                if (line.startsWith('@')) continue;

                let disp = isNextHidden ? 'display:none;' : 'display:block;';
                if (isNextHidden) isNextHidden = false;

                // 1. Ask Input
                let askMatch = line.match(/^(\w+)\s*=\s*ask(['"])(.*?)\2/);
                if (askMatch) {
                    let [, vName, , promptTxt] = askMatch;
                    htmlBody += `<div style="margin:10px 0; ${disp}">
                        <button onclick="let r=prompt('${promptTxt}'); if(r){ memory['${vName}']=r; document.getElementById('v_${vName}').innerText=r; }" style="padding:6px 12px; cursor:pointer;">${promptTxt}</button>
                        <span id="v_${vName}" style="margin:0 10px; font-weight:bold; color:#00ffcc;"></span>
                    </div>\n`;
                    continue;
                }

                // 2. Print
                let pMatch = line.match(/^p(['"])(.*?)\1(?:#([0-9a-fA-F]{3,6}))?/);
                if (pMatch) {
                    let [, , txt, color] = pMatch;
                    let c = color ? `color:#${color};` : 'color:#000;';
                    htmlBody += `<div style="${c} font-size:1.1rem; margin:5px 0; ${disp}" id="p_${i}">${txt}</div>\n`;
                    jsLogic += `if(memory['${txt}'] !== undefined) { document.getElementById('p_${i}').innerText = memory['${txt}']; }\n`;
                    continue;
                }

                // 3. Backgrounds (bj, bjo, bg, bgo) with Opacity %
                let shapeMatch = line.match(/^(?:#([0-9a-fA-F]{3,6})#(bg|bgo|bj|bjo)|(bg|bgo|bj|bjo)#([0-9a-fA-F]{3,6}))\(([\d.]+)\.([\d.]+)\)(?:%(\d+))?/i);
                if (shapeMatch) {
                    let hex = shapeMatch[1] || shapeMatch[4];
                    let cmd = (shapeMatch[2] || shapeMatch[3]).toLowerCase();
                    let w = shapeMatch[5], h = shapeMatch[6];
                    let op = shapeMatch[7] ? (parseInt(shapeMatch[7])/100) : 1;
                    let rad = (cmd === 'bgo' || cmd === 'bjo') ? '50%' : '4px';
                    let pos = (cmd === 'bj' || cmd === 'bjo') ? 'position:absolute; z-index:-1;' : 'position:relative; margin:8px 0;';
                    
                    htmlBody += `<div style="background:#${hex}; width:${w * 25}px; height:${h * 25}px; border-radius:${rad}; opacity:${op}; ${pos} ${disp}"></div>\n`;
                    continue;
                }

                // 4. Buttons (cp, cb)
                let btnMatch = line.match(/^c(b|p)(['"])(.*?)\2gt/i);
                if (btnMatch) {
                    let [, type, , txt] = btnMatch;
                    let isCb = (type.toLowerCase() === 'b');
                    htmlBody += `<button onclick="this.nextElementSibling.style.display='block'; ${isCb ? "this.style.display='none';" : ""}" style="padding:8px 16px; margin:8px 0; cursor:pointer; font-weight:bold;">${txt}</button>\n`;
                    isNextHidden = true;
                    continue;
                }

                // 5. Math
                let mathMatch = line.match(/^Math\.\.\.(.+?)([\+\-\*\÷\^])(.+?)=(.+)/i);
                if (mathMatch) {
                    let [, l, op, r, resVar] = mathMatch;
                    jsLogic += `memory['${resVar}'] = evalM('${l} ${op} ${r}');\n`;
                    continue;
                }

                // 6. AI Core (b/f)
                let aiMatch1 = line.match(/^in\.([a-zA-Z0-9_]+)\s*=\s*(['"])(.*?)\2/i);
                if (aiMatch1 && i + 1 < lines.length) {
                    let aiMatch2 = lines[i+1].trim().match(/^b\s*(['"])(.*?)\1\s*f\s*(['"])(.*?)\3/i);
                    if (aiMatch2) {
                        let [, target, , trigger] = aiMatch1;
                        let [, , oldW, , newW] = aiMatch2;
                        jsLogic += `if(memory['${target}'] && memory['${target}'].includes('${trigger}')) { memory['${target}'] = memory['${target}'].replace(new RegExp('${oldW}', 'g'), '${newW}'); }\n`;
                        i++;
                        continue;
                    }
                }

                // 7. Payments
                let payR = line.match(/^(https?:\/\/[^\s]+)\.pay#([\d.]+)#(['"])([A-Za-z]+)\3/);
                if (payR) {
                    htmlBody += `<button onclick="window.open('${payR[1]}', '_blank')" style="background:#007bff; color:#fff; border:none; padding:8px 14px; border-radius:4px; margin:5px 0; cursor:pointer; ${disp}">دفع حقيقي (${payR[2]} ${payR[4]}) ↗</button>\n`;
                    continue;
                }
                let payF = line.match(/^Fpay#([\d.]+)#(['"])([A-Za-z]+)\2/);
                if (payF) {
                    htmlBody += `<button onclick="alert('دفع تجريبي: ${payF[1]} ${payF[3]}')" style="background:#28a745; color:#fff; border:none; padding:8px 14px; border-radius:4px; margin:5px 0; cursor:pointer; ${disp}">دفع تجريبي (${payF[1]} ${payF[3]})</button>\n`;
                    continue;
                }
            }

            return `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${appName}</title>
    <meta name="description" content="Generated by A137 code">
</head>
<body>
    ${htmlBody}
    <script>${jsLogic}<\/script>
</body>
</html>`;
        }

        function renderGuide() {
            const guide = document.getElementById('guideBody');
            if (currentLang === 'ar') {
                guide.innerHTML = `
                    <h3>1. الهيكل الأساسي</h3>
                    <p>• بداية التطبيق: <code>!start-a137!</code> وفي النهاية: <code>!end!</code></p>
                    <p>• تسمية التطبيق: <code>webapp!اسم_التطبيق!</code></p>
                    
                    <h3>2. مرونة علامات التنصيص</h3>
                    <p>• تقبل اللغة علامات التنصيص المفردة <code>' '</code> والمزدوجة <code>" "</code> تبادلياً في كافة الأوامر بلا استثناء.</p>
                    
                    <h3>3. الخلفيات الشفافة والمطلقة (bj / bg)</h3>
                    <p>• <b>bg / bgo:</b> أشكال هندسية عادية (مربع / دائري).</p>
                    <p>• <b>bj / bjo:</b> خلفيات مطلقة تقع خلف جميع العناصر ولا تغطي الأزرار والنصوص.</p>
                    <p>• <b>دعم الشفافية (%):</b> كتابة نسبة الشفافية بالنهاية مثل <code>%50</code>.</p>
                    <p>• <b>مرونة الترتيب:</b> تقبل طريقتين كتابة: <code>bj#HEX(1.1)%50</code> أو <code>#HEX#bj(1.1)%50</code>.</p>
                    
                    <h3>4. النظام الرياضي المتقدم</h3>
                    <p>• تبدأ الأوامر الرياضية بـ: <code>Math...x+y=z</code></p>
                    <p>• العمليات المدعومة: <code>+</code> (جمع)، <code>-</code> (طرح)، <code>*</code> (ضرب)، <code>÷</code> (قسمة)، <code>^</code> (أسس).</p>
                    
                    <h3>5. خوارزميات الذكاء الاصطناعي (AI)</h3>
                    <p>• السطر الأول (النطاق والشرط): <code>in.v = "الكلمة"</code></p>
                    <p>• السطر الثاني (الاستبدال الجذري): <code>b "القديمة" f "الجديدة"</code> (يشترط تنوع الأحرف الكبيرة والصغيرة في الكلمة الجديدة).</p>
                    
                    <h3>6. الأزرار والحفز Toggles</h3>
                    <p>• <b>زر مستمر:</b> <code>cp"النص"gt</code> (ينفذ ما تحته ولا يختفي).</p>
                    <p>• <b>زر مخفي:</b> <code>cb"النص"gt</code> (ينفذ ما تحته ويختفي فوراً).</p>
                    
                    <h3>7. بوابات الدفع</h3>
                    <p>• <b>دفع تجريبي:</b> <code>Fpay#10.00#"USD"</code></p>
                    <p>• <b>دفع حقيقي:</b> <code>https://checkout.pay#100.00#"SAR"</code> (يفتح برابط خارجي لحماية الأداء).</p>
                `;
            } else {
                guide.innerHTML = `
                    <h3>1. Basic Structure</h3>
                    <p>• Start: <code>!start-a137!</code> | End: <code>!end!</code></p>
                    <p>• WebApp Name: <code>webapp!AppName!</code></p>
                    
                    <h3>2. Quotation Flexibility</h3>
                    <p>• Supports single <code>' '</code> and double <code>" "</code> quotes interchangeably in all commands.</p>
                    
                    <h3>3. Absolute & Transparent Backgrounds</h3>
                    <p>• <b>bg / bgo:</b> Standard shapes (box / circle).</p>
                    <p>• <b>bj / bjo:</b> Absolute background layer placed behind elements.</p>
                    <p>• <b>Opacity Support (%):</b> Add opacity at the end e.g., <code>%50</code>.</p>
                    <p>• <b>Flexible Ordering:</b> Accepts both <code>bj#HEX(1.1)%50</code> or <code>#HEX#bj(1.1)%50</code>.</p>
                    
                    <h3>4. Math System</h3>
                    <p>• Math syntax starts with: <code>Math...x+y=z</code></p>
                    <p>• Supported Operators: <code>+</code>, <code>-</code>, <code>*</code>, <code>÷</code>, and <code>^</code> (power).</p>
                    
                    <h3>5. AI Core Algorithm</h3>
                    <p>• Line 1: <code>in.v = "word"</code></p>
                    <p>• Line 2: <code>b "oldWord" f "newWord"</code> (destructive replacement with mixed-case requirement).</p>
                    
                    <h3>6. Interactive Buttons</h3>
                    <p>• <b>Persistent Button:</b> <code>cp"Text"gt</code></p>
                    <p>• <b>Auto-hiding Button:</b> <code>cb"Text"gt</code></p>
                    
                    <h3>7. Payment Integration</h3>
                    <p>• <b>Sandbox:</b> <code>Fpay#10.00#"USD"</code></p>
                    <p>• <b>Real Payment:</b> <code>URL.pay#100.00#"SAR"</code> (Opens in a new tab).</p>
                `;
            }
        }

        function runCompiler() {
            const code = document.getElementById('codeEditor').value;
            const compiled = compileA137(code);
            const iframe = document.getElementById('previewFrame');
            iframe.contentWindow.document.open();
            iframe.contentWindow.document.write(compiled);
            iframe.contentWindow.document.close();
        }

        function downloadHTML() {
            const code = document.getElementById('codeEditor').value;
            const compiled = compileA137(code);
            const blob = new Blob([compiled], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.onload = runCompiler;
    </script>
</body>
    </html>
