<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A137 Code IDE - المترجم الشامل</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0c10'/><path d='M20 75 L50 25 L80 75 M32 58 L68 58' stroke='%2366fcf1' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='50' cy='38' r='5' fill='%2366fcf1'/></svg>">
    
    <meta name="description" content="بيئة تطوير متكاملة ومترجم شامل للغة البرمجة A137">
    <meta name="keywords" content="A137, IDE, Compiler, Programming Language, Web Application">
    <meta name="author" content="A137 Team">
    <meta name="theme-color" content="#0b0c10">
    
    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-panel: #1f2833;
            --accent: #66fcf1;
            --text-main: #c5c6c7;
            --border: #45a29e;
            --danger: #ff4c4c;
            --btn-hover: #45a29e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--bg-panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); }
        
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 38px; height: 38px; background: var(--bg-main); border: 2px solid var(--accent); border-radius: 8px; padding: 4px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(102, 252, 241, 0.3); }
        .brand-logo svg { width: 100%; height: 100%; }
        .logo-text { font-size: 1.3rem; font-weight: bold; color: var(--accent); letter-spacing: 1px; }
        
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
        
        button { background: var(--bg-main); color: var(--accent); border: 1px solid var(--accent); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s ease; }
        button:hover { background: var(--accent); color: var(--bg-main); box-shadow: 0 0 10px rgba(102, 252, 241, 0.4); }
        
        .workspace { display: flex; flex: 1; height: calc(100vh - 60px); }
        .panel { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 10px; }
        .panel.left { border-left: 2px solid var(--border); }
        [dir="ltr"] .panel.left { border-left: none; border-right: 2px solid var(--border); }
        
        textarea.editor { flex: 1; background: #050505; color: #00ffcc; border: 1px solid var(--border); border-radius: 6px; padding: 15px; font-family: 'Courier New', monospace; font-size: 1rem; line-height: 1.6; resize: none; outline: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .preview-wrapper { flex: 1; background: #1a1a2e; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #1a1a2e; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-panel); border: 2px solid var(--border); border-radius: 10px; width: 90%; max-width: 800px; max-height: 85vh; padding: 25px; overflow-y: auto; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        .close-btn { position: absolute; top: 12px; left: 12px; background: var(--danger); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        [dir="ltr"] .close-btn { left: auto; right: 12px; }
        
        .file-box { border: 2px dashed var(--accent); padding: 25px; text-align: center; border-radius: 6px; cursor: pointer; margin: 15px 0; background: rgba(0,0,0,0.2); }
        #decompiledCode { width: 100%; height: 220px; background: #000; color: #00ffcc; margin-top: 10px; padding: 10px; border-radius: 6px; font-family: monospace; display: none; resize: none; border: 1px solid var(--border); }
        
        .guide-section { margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
        .guide-section h3 { color: var(--accent); margin-bottom: 8px; font-size: 1.1rem; }
        .guide-section ul { list-style-type: square; padding-right: 20px; }
        [dir="ltr"] .guide-section ul { padding-right: 0; padding-left: 20px; }
        .guide-section li { margin-bottom: 8px; line-height: 1.5; color: var(--text-main); }
        code { background: #000; color: #00ffcc; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #222; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 100 100">
                    <path d="M20 75 L50 25 L80 75 M32 58 L68 58" stroke="#66fcf1" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="50" cy="38" r="5" fill="#66fcf1"/>
                </svg>
            </div>
            <div class="logo-text">A137 Code IDE</div>
        </div>
        <div class="toolbar">
            <button id="btnRun">▶ تشغيل المعاينة</button>
            <button id="btnDownload">💾 تحميل الملف (.html)</button>
            <button id="btnDecompile">🔓 تفكيك ملف</button>
            <button id="btnGuide">📖 دليل اللغة الكامل</button>
            <button id="btnLang">🌐 English / عربي</button>
        </div>
    </header>

    <div class="workspace">
        <div class="panel left">
            <textarea id="codeEditor" class="editor" spellcheck="false">webapp!تطبيق A137 المتطور!
icon!"https://cdn-icons-png.flaticon.com/512/1006/1006771.png"

@ === 1. تعريف المتغيرات بنصوص نظيفة للجافاسكريبت ===
confirm = "نعم" | "أجل" | "موافق" | "yes"

@ === 2. الطباعة والعناوين ===
p"مرحباً بك في A137 المتطور مع معالجة الجافاسكريبت النظيفة"#66fcf1

@ === 3. المدخلات وقراءة القيم بدون علامات تنصيص ===
userAns = ask"أدخل خيارك (نعم / أجل / موافق / yes):"
p"الإجابة المحددة هي:"#00ff00
p"userAns"

@ === 4. العمليات الحسابية ===
num = 5
Math...num^2=res
p"مربع الرقم 5 هو:"#ffff00
p"res"

@ === 5. الأزرار والحفظ ===
cp"اضغط للمتابعة"gt
p"تم ضغط الزر بنجاح!"#ff00ff

SQL...SAVE confirm = userAns</textarea>
        </div>
        <div class="panel right">
            <div class="preview-wrapper">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <!-- Modal: Decompile -->
    <div class="modal-overlay" id="decompileModal">
        <div class="modal-content">
            <button class="close-btn" id="btnCloseDecompile">✕</button>
            <h2 id="decompTitle" style="color:var(--accent); margin-bottom:10px;">تفكيك واستخراج الكود</h2>
            <p id="decompDesc">اختر ملف HTML لتفكيكه وقراءة النص المصدري المولد منه:</p>
            
            <div class="file-box" id="fileBox">
                <span id="lblUpload">📄 اضغط هنا لرفع ملف HTML</span>
                <input type="file" id="fileUpload" accept=".html" style="display:none;">
            </div>
            
            <textarea id="decompiledCode" readonly></textarea>
            <button id="btnCopyDecomp" style="display:none; margin-top:10px; width:100%;">📋 نسخ الكود المستخرج</button>
        </div>
    </div>

    <!-- Modal: Guide -->
    <div class="modal-overlay" id="guideModal">
        <div class="modal-content">
            <button class="close-btn" id="btnCloseGuide">✕</button>
            <h2 id="guideTitle" style="color:var(--accent); margin-bottom:15px;">دليل وقواعد لغة A137 code</h2>
            <div id="guideBody"></div>
        </div>
    </div>

    <script>
        let currentLang = 'ar';
        let currentBlobUrl = null;

        const dict = {
            ar: {
                btnRun: "▶ تشغيل المعاينة", btnDownload: "💾 تحميل الملف (.html)", btnDecompile: "🔓 تفكيك ملف", btnGuide: "📖 دليل اللغة الكامل", btnLang: "🌐 English / عربي",
                decompTitle: "تفكيك واستخراج الكود", decompDesc: "اختر ملف HTML لتفكيكه وقراءة النص المصدري المولد منه:",
                lblUpload: "📄 اضغط هنا لرفع ملف HTML", btnCopyDecomp: "📋 نسخ الكود المستخرج", guideTitle: "دليل وقواعد لغة A137 code"
            },
            en: {
                btnRun: "▶ Preview Result", btnDownload: "💾 Download File (.html)", btnDecompile: "🔓 Decompile File", btnGuide: "📖 Language Rules", btnLang: "🌐 عربي / English",
                decompTitle: "Decompile HTML File", decompDesc: "Upload an HTML file to extract source code:",
                lblUpload: "📄 Click here to upload HTML file", btnCopyDecomp: "📋 Copy Extracted Code", guideTitle: "Complete A137 Code Language Guide"
            }
        };

        document.getElementById('btnRun').addEventListener('click', runCompiler);
        document.getElementById('btnDownload').addEventListener('click', downloadHTML);
        document.getElementById('btnDecompile').addEventListener('click', () => openModal('decompileModal'));
        document.getElementById('btnGuide').addEventListener('click', openGuide);
        document.getElementById('btnLang').addEventListener('click', toggleLanguage);

        document.getElementById('btnCloseDecompile').addEventListener('click', () => closeModal('decompileModal'));
        document.getElementById('btnCloseGuide').addEventListener('click', () => closeModal('guideModal'));

        document.getElementById('fileBox').addEventListener('click', () => document.getElementById('fileUpload').click());
        document.getElementById('fileUpload').addEventListener('change', handleFileUpload);
        document.getElementById('btnCopyDecomp').addEventListener('click', copyDecompiled);

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            for (let id in dict[currentLang]) {
                let el = document.getElementById(id);
                if (el) el.innerText = dict[currentLang][id];
            }
            renderGuide();
        }

        function openGuide() { renderGuide(); openModal('guideModal'); }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('decompiledCode').style.display = 'block';
                document.getElementById('decompiledCode').value = e.target.result;
                document.getElementById('btnCopyDecomp').style.display = 'block';
            };
            reader.readAsText(file);
        }

        function copyDecompiled() {
            const txt = document.getElementById('decompiledCode');
            txt.select();
            document.execCommand('copy');
            alert(currentLang === 'ar' ? "تم النسخ!" : "Copied!");
        }

        function cleanQuotes(str) {
            if (typeof str !== 'string') return str;
            return str.trim().replace(/^["']|["']$/g, '').trim();
        }

        function getNextExecutableLine(lines, startIndex) {
            for (let j = startIndex + 1; j < lines.length; j++) {
                let trimmed = lines[j].trim();
                if (trimmed && !trimmed.startsWith('@') && !trimmed.startsWith('webapp!') && !trimmed.startsWith('icon!')) {
                    return trimmed;
                }
            }
            return null;
        }

        function parseA137(sourceCode) {
            let appName = "A137 Application";
            let appIcon = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2366fcf1'/></svg>";

            const appMatch = sourceCode.match(/webapp!(.*?!)/);
            if (appMatch) appName = cleanQuotes(appMatch[1].replace('!', ''));

            const iconMatch = sourceCode.match(/icon!(["'])(.*?)\1/i);
            if (iconMatch) appIcon = cleanQuotes(iconMatch[2]);

            const lines = sourceCode.split('\n');
            let bodyHTML = [];
            let runtimeActions = {};
            let initialVars = {};
            let mathRules = [];
            let sqlRules = [];
            let actionCounter = 0;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line || line.startsWith('webapp!') || line.startsWith('icon!') || line.startsWith('@')) continue;

                // 1. المتغيرات المباشرة مع معالجة جافاسكريبت للنصوص والمصفوفات
                let multiVarMatch = line.match(/^(\w+)\s*=\s*(.+)$/i);
                if (multiVarMatch && !line.startsWith('p"') && !line.startsWith('ask') && !line.startsWith('Math') && !line.startsWith('SQL') && !line.startsWith('Pay') && !line.startsWith('c')) {
                    let varName = multiVarMatch[1].trim();
                    let rawValues = multiVarMatch[2].trim();
                    
                    if (rawValues.includes('|')) {
                        let parts = rawValues.split('|').map(v => cleanQuotes(v));
                        initialVars[varName] = parts;
                    } else {
                        let cleaned = cleanQuotes(rawValues);
                        initialVars[varName] = isNaN(cleaned) || cleaned === '' ? cleaned : parseFloat(cleaned);
                    }
                    continue;
                }

                // 2. الطباعة الشاملة (p)
                let pMatch = line.match(/^p(["'])(.*?)\1(?:#([0-9a-fA-F]{3,6}))?/i);
                if (pMatch) {
                    let [, , txt, color] = pMatch;
                    let cleanTxt = cleanQuotes(txt);
                    let style = color ? `color:#${color};` : 'color:#ffffff;';
                    let elemId = `elem_${i}`;
                    bodyHTML.push(`<div id="${elemId}" class="a137-print" data-target="${cleanTxt}" style="${style} margin:8px 0; font-size:1.1rem; font-weight:bold;">${cleanTxt}</div>`);
                    continue;
                }

                // 3. المدخلات (ask)
                let askVarMatch = line.match(/^(\w+)\s*=\s*ask(["'])(.*?)\2/i);
                if (askVarMatch) {
                    let [, varName, , promptTxt] = askVarMatch;
                    let cleanPrompt = cleanQuotes(promptTxt);
                    bodyHTML.push(`
                        <div style="margin:10px 0;">
                            <button onclick="handleAsk('${varName}', '${cleanPrompt}')" style="padding:8px 14px; background:#1f2833; color:#66fcf1; border:1px solid #45a29e; border-radius:5px; cursor:pointer;">${cleanPrompt}</button>
                            <span id="v_${varName}" style="margin:0 10px; color:#00ffcc; font-weight:bold;"></span>
                        </div>
                    `);
                    continue;
                }

                let askStandaloneMatch = line.match(/^ask(["'])(.*?)\1/i);
                if (askStandaloneMatch) {
                    let [, , promptTxt] = askStandaloneMatch;
                    let cleanPrompt = cleanQuotes(promptTxt);
                    bodyHTML.push(`
                        <div style="margin:10px 0;">
                            <button onclick="prompt('${cleanPrompt}')" style="padding:8px 14px; background:#1f2833; color:#c5c6c7; border:1px solid #45a29e; border-radius:5px; cursor:pointer;">${cleanPrompt}</button>
                        </div>
                    `);
                    continue;
                }

                // 4. الأزرار (cp / cb)
                let btnMatch = line.match(/^c(b|p)(["'])(.*?)\2gt(?:(["'])(.*?)\4)?/i);
                if (btnMatch) {
                    let [, type, , btnTxt, , url] = btnMatch;
                    let cleanBtnTxt = cleanQuotes(btnTxt);
                    let cleanUrl = url ? cleanQuotes(url) : null;
                    let nextLine = getNextExecutableLine(lines, i);
                    let actionKey = `action_${actionCounter++}`;

                    runtimeActions[actionKey] = {
                        url: cleanUrl,
                        type: type.toLowerCase(),
                        nextLine: nextLine
                    };

                    let btnStyle = "padding:10px 18px; margin:8px 4px; cursor:pointer; font-weight:bold; border-radius:6px; background:#5865F2; color:#fff; border:none; transition:0.2s;";
                    bodyHTML.push(`<button id="btn_${actionKey}" onclick="triggerButton('${actionKey}')" style="${btnStyle}">${cleanBtnTxt}</button>`);
                    continue;
                }

                // 5. المدفوعات (Pay)
                let payMatch = line.match(/^Pay#([\d\.]+)#(.*)$/i);
                if (payMatch) {
                    let [, amount, rest] = payMatch;
                    let isTest = rest.endsWith('F');
                    let targetUrl = cleanQuotes(isTest ? rest.slice(0, -1) : rest);

                    let clickCode = "";
                    if (isTest) {
                        clickCode = `alert('[اختبار دفع تجريبي - تم تخطي العملية بنجاح!]: المبلغ ${amount} SAR');`;
                        if (targetUrl) clickCode += ` window.open('${targetUrl}', '_blank');`;
                    } else {
                        if (targetUrl) {
                            clickCode = `window.open('${targetUrl}', '_blank');`;
                        } else {
                            clickCode = `alert('[دفع حقيقي]: تم إطلاق بطاقة الجهاز لخصم ${amount} SAR');`;
                        }
                    }

                    let btnColor = isTest ? '#e67e22' : '#2ecc71';
                    let label = isTest ? `دفع تجريبي - ${amount} SAR` : `دفع حقيقي - ${amount} SAR`;
                    bodyHTML.push(`<button onclick="${clickCode}" style="padding:10px 18px; margin:8px 0; cursor:pointer; font-weight:bold; border-radius:6px; background:${btnColor}; color:#fff; border:none;">💳 ${label}</button>`);
                    continue;
                }

                // 6. العمليات الحسابية (Math)
                let mathMatch = line.match(/^Math\.\.\.(.+?)([\+\-\*\÷\^])(.+?)=((?:[a-zA-Z0-9_]+))/i);
                if (mathMatch) {
                    let [, left, op, right, resVar] = mathMatch;
                    mathRules.push({ left: cleanQuotes(left), op: op.trim(), right: cleanQuotes(right), resVar: cleanQuotes(resVar) });
                    continue;
                }

                // 7. قاعدة البيانات (SQL)
                let sqlMatch = line.match(/^SQL\.\.\.(SAVE|LOAD|DELETE)\s+(\w+)(?:\s*=\s*(.+))?/i);
                if (sqlMatch) {
                    let [, action, key, value] = sqlMatch;
                    sqlRules.push({ action: action.toUpperCase(), key: cleanQuotes(key), value: value ? cleanQuotes(value) : null });
                    continue;
                }
            }

            const runtimeScript = `
                let memory = ${JSON.stringify(initialVars)};
                const actions = ${JSON.stringify(runtimeActions)};
                const mathRules = ${JSON.stringify(mathRules)};
                const sqlRules = ${JSON.stringify(sqlRules)};

                function handleAsk(varName, promptTxt) {
                    let val = prompt(promptTxt);
                    if (val !== null) {
                        val = val.trim();
                        memory[varName] = isNaN(val) || val === '' ? val : parseFloat(val);
                        let span = document.getElementById('v_' + varName);
                        if (span) span.innerText = memory[varName];
                        evaluateEngine();
                    }
                }

                function triggerButton(actionKey) {
                    let act = actions[actionKey];
                    if (!act) return;

                    if (act.type === 'b') {
                        let btn = document.getElementById('btn_' + actionKey);
                        if (btn) btn.style.display = 'none';
                    }

                    if (act.url) {
                        window.open(act.url, '_blank');
                    }

                    if (act.nextLine) {
                        executeSingleLine(act.nextLine);
                    }
                }

                function executeSingleLine(lineStr) {
                    let pMatch = lineStr.match(/^p(["'])(.*?)\\1(?:#([0-9a-fA-F]{3,6}))?/i);
                    if (pMatch) {
                        let [, , txt, color] = pMatch;
                        let div = document.createElement('div');
                        div.style.color = color ? '#' + color : '#ffffff';
                        div.style.margin = '8px 0';
                        div.style.fontSize = '1.1rem';
                        div.style.fontWeight = 'bold';

                        let displayValue = txt;
                        if (memory[txt] !== undefined) {
                            let raw = memory[txt];
                            displayValue = Array.isArray(raw) ? raw.join(' / ') : raw;
                        }

                        div.innerText = displayValue;
                        document.body.appendChild(div);
                        return;
                    }

                    let mathMatch = lineStr.match(/^Math\\.\\.\\.(.+?)([\\+\\-\\*\÷\\^])(.+?)=((?:[a-zA-Z0-9_]+))/i);
                    if (mathMatch) {
                        let [, left, op, right, resVar] = mathMatch;
                        let valL = memory[left] !== undefined ? memory[left] : parseFloat(left);
                        let valR = memory[right] !== undefined ? memory[right] : parseFloat(right);
                        if (!isNaN(valL) && !isNaN(valR)) {
                            let res = 0;
                            if (op === '+') res = valL + valR;
                            else if (op === '-') res = valL - valR;
                            else if (op === '*') res = valL * valR;
                            else if (op === '÷') res = valL / valR;
                            else if (op === '^') res = Math.pow(valL, valR);
                            memory[resVar] = res;
                            evaluateEngine();
                        }
                    }
                }

                function evaluateEngine() {
                    mathRules.forEach(rule => {
                        let valL = memory[rule.left] !== undefined ? memory[rule.left] : parseFloat(rule.left);
                        let valR = memory[rule.right] !== undefined ? memory[rule.right] : parseFloat(rule.right);
                        if (!isNaN(valL) && !isNaN(valR)) {
                            let res = 0;
                            if (rule.op === '+') res = valL + valR;
                            else if (rule.op === '-') res = valL - valR;
                            else if (rule.op === '*') res = valL * valR;
                            else if (rule.op === '÷') res = valL / valR;
                            else if (rule.op === '^') res = Math.pow(valL, valR);
                            memory[rule.resVar] = res;
                        }
                    });

                    sqlRules.forEach(rule => {
                        if (rule.action === 'SAVE') {
                            let v = memory[rule.value] !== undefined ? memory[rule.value] : rule.value;
                            localStorage.setItem(rule.key, JSON.stringify(v));
                        } else if (rule.action === 'LOAD') {
                            let loaded = localStorage.getItem(rule.key);
                            if (loaded !== null) memory[rule.key] = JSON.parse(loaded);
                        } else if (rule.action === 'DELETE') {
                            localStorage.removeItem(rule.key);
                        }
                    });

                    document.querySelectorAll('.a137-print').forEach(el => {
                        let target = el.getAttribute('data-target');
                        if (memory[target] !== undefined) {
                            let val = memory[target];
                            el.innerText = Array.isArray(val) ? val.join(' / ') : val;
                        }
                    });
                }

                window.onload = evaluateEngine;
            `;

            return `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${appName}</title>
    <link rel="icon" href="${appIcon}">
    <style>body { background:#1a1a2e; color:#fff; padding:20px; font-family:sans-serif; }</style>
</head>
<body>
    ${bodyHTML.join('\n    ')}
    <script>${runtimeScript}<\/script>
</body>
</html>`;
        }

        function renderGuide() {
            const guide = document.getElementById('guideBody');
            if (currentLang === 'ar') {
                guide.innerHTML = `
                    <div class="guide-section">

        function runCompiler() {
            const code = document.getElementById('codeEditor').value;
            const compiled = parseA137(code);
            
            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            
            const blob = new Blob([compiled], { type: 'text/html;charset=utf-8' });
            currentBlobUrl = URL.createObjectURL(blob);
            document.getElementById('previewFrame').src = currentBlobUrl;
        }

        function downloadHTML() {
            const code = document.getElementById('codeEditor').value;
            const compiled = parseA137(code);
            const blob = new Blob([compiled], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.onload = runCompiler;
